name: Publish Beez progression and companion Windows test release
on:
  push:
    branches: [beez-test-992b959-download]
    paths: [.github/workflows/publish-beez-test.yml]
permissions:
  contents: write
concurrency:
  group: publish-beez-test-992b959
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out validated package transport
        uses: actions/checkout@v4
      - name: Reassemble and validate package
        shell: bash
        run: |
          python3 - <<'CHECK'
          import hashlib,json,pathlib,zipfile
          m=json.loads(pathlib.Path('DOWNLOAD-MANIFEST.json').read_text())
          assert m['commit'] == '992b959fbf44a48497a4e5baae5a9937dce4a6c2'
          assert m['sha256'] == 'c84eab380a394f493ad86fcd6f7b3ec5766b763ced59d730b98e93057806e942'
          output=pathlib.Path(m['filename'])
          with output.open('wb') as destination:
              for part in m['parts']:
                  data=pathlib.Path(part['name']).read_bytes()
                  assert len(data)==part['bytes']
                  assert hashlib.sha256(data).hexdigest()==part['sha256']
                  destination.write(data)
          assert output.stat().st_size==m['bytes']
          assert hashlib.sha256(output.read_bytes()).hexdigest()==m['sha256']
          assert output.with_suffix('.zip.sha256').read_text().split()[0]==m['sha256']
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
              for name in ['DEPLOYMENT.md','Deploy-TestBuild.ps1','Rollback-TestBuild.ps1','REPLACEMENTS.csv','SHA256SUMS','RELEASE-NOTES.md','notices/BEEZ-REGENERATION-OVERHAUL.md','notices/BEEZ-DARKNESS-FALLS-RVR-XP.md','notices/BEEZ-SPAWN-REFRESH.md']:
                  assert name in archive.namelist()
              info=json.loads(archive.read('BUILD-INFO.json'))
              assert info['commit']==m['commit'] and info['selfContained'] and info['rid']=='win-x64'
              assert info['tests']['passed']==2940 and info['tests']['failed']==0
              for proof in info['sourceRevisionChecks']:
                  data=archive.read(proof['path'])
                  assert m['commit'].encode() in data
                  assert hashlib.sha256(data).hexdigest()==proof['sha256']
              for line in archive.read('SHA256SUMS').decode().splitlines():
                  expected,name=line.split('  ',1)
                  assert hashlib.sha256(archive.read(name)).hexdigest()==expected
          print('Exact commit, binaries, complete package hashes and deployment files verified.')
          CHECK
      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create beez-test-992b959 \
            beez-online-992b959-win-x64-release.zip \
            beez-online-992b959-win-x64-release.zip.sha256 \
            --repo BeezKneezItem9/OfflineDAoC \
            --target 992b959fbf44a48497a4e5baae5a9937dce4a6c2 \
            --prerelease \
            --title 'Beez Online Progression and Companion Refresh — Windows x64 Test Build 992b959' \
            --notes-file RELEASE-NOTES.md
